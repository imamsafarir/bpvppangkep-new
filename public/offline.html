<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sedang Offline - BPVP Pangkep Super APP</title>
        <link rel="icon" href="/icons/icon-192x192.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family:
                    "Poppins",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
            }
            body {
                background: linear-gradient(135deg, #0a2e50 0%, #0f4c81 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                color: #ffffff;
            }
            .offline-card {
                background: rgba(255, 255, 255, 0.98);
                color: #1e293b;
                max-width: 480px;
                width: 100%;
                border-radius: 28px;
                padding: 40px 32px;
                text-align: center;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
                position: relative;
                overflow: hidden;
            }
            .top-accent {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 6px;
                background: linear-gradient(90deg, #0a2e50, #eab308, #0ea5e9);
            }
            .icon-wrapper {
                position: relative;
                display: inline-block;
                margin-bottom: 24px;
            }
            .app-logo {
                width: 88px;
                height: 88px;
                border-radius: 22px;
                box-shadow: 0 10px 25px -5px rgba(10, 46, 80, 0.3);
                border: 3px solid #ffffff;
            }
            .offline-badge {
                position: absolute;
                bottom: -6px;
                right: -6px;
                background: #ef4444;
                color: #ffffff;
                width: 32px;
                height: 32px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 3px solid #ffffff;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            }
            h1 {
                font-size: 22px;
                font-weight: 800;
                color: #0a2e50;
                margin-bottom: 8px;
                letter-spacing: -0.02em;
            }
            .app-title {
                font-size: 12px;
                font-weight: 700;
                color: #0284c7;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                margin-bottom: 12px;
            }
            p {
                font-size: 13.5px;
                color: #64748b;
                line-height: 1.6;
                margin-bottom: 28px;
            }
            .btn-reload {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                width: 100%;
                background: #0a2e50;
                color: #ffffff;
                font-size: 14px;
                font-weight: 600;
                padding: 14px 24px;
                border-radius: 16px;
                border: none;
                cursor: pointer;
                transition: all 0.2s ease;
                box-shadow: 0 8px 16px -4px rgba(10, 46, 80, 0.3);
            }
            .btn-reload:hover {
                background: #0f4c81;
                transform: translateY(-2px);
                box-shadow: 0 12px 20px -4px rgba(10, 46, 80, 0.4);
            }
            .btn-reload:active {
                transform: translateY(0);
            }
            .status-box {
                margin-top: 24px;
                padding: 12px;
                background: #f8fafc;
                border: 1px solid #e2e8f0;
                border-radius: 12px;
                font-size: 12px;
                color: #64748b;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }
            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #ef4444;
                animation: pulse 2s infinite;
            }
            .status-dot.online {
                background: #22c55e;
            }
            @keyframes pulse {
                0% {
                    opacity: 1;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.5;
                    transform: scale(1.2);
                }
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
            }
        </style>
    </head>
    <body>
        <div class="offline-card">
            <div class="top-accent"></div>

            <div class="icon-wrapper">
                <img
                    src="/icons/icon-192x192.png"
                    alt="BPVP Pangkep Logo"
                    class="app-logo"
                />
                <div class="offline-badge" id="badge">
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                        <path
                            d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"
                        ></path>
                        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                        <line x1="12" y1="20" x2="12.01" y2="20"></line>
                    </svg>
                </div>
            </div>

            <div class="app-title">BPVP Pangkep - Super APP</div>
            <h1>Anda Sedang Offline</h1>
            <p>
                Koneksi internet Anda terputus atau tidak stabil. Halaman yang
                telah Anda kunjungi sebelumnya tetap dapat dibuka saat offline.
            </p>

            <button class="btn-reload" onclick="checkAndReload()">
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path
                        d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"
                    />
                </svg>
                Coba Muat Ulang
            </button>

            <div class="status-box">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText"
                    >Menunggu koneksi internet tersambung...</span
                >
            </div>
        </div>

        <script>
            function updateStatus() {
                const isOnline = navigator.onLine;
                const dot = document.getElementById("statusDot");
                const text = document.getElementById("statusText");
                if (isOnline) {
                    dot.classList.add("online");
                    text.textContent =
                        "Koneksi internet terdeteksi! Memuat ulang...";
                    setTimeout(() => window.location.reload(), 1000);
                } else {
                    dot.classList.remove("online");
                    text.textContent =
                        "Menunggu koneksi internet tersambung...";
                }
            }

            function checkAndReload() {
                if (navigator.onLine) {
                    window.location.reload();
                } else {
                    const btn = document.querySelector(".btn-reload");
                    const orig = btn.innerHTML;
                    btn.innerHTML = "Memeriksa sinyal...";
                    setTimeout(() => {
                        btn.innerHTML = orig;
                        alert(
                            "Koneksi internet belum tersedia. Mohon periksa WiFi atau kuota data Anda.",
                        );
                    }, 800);
                }
            }

            window.addEventListener("online", updateStatus);
            window.addEventListener("offline", updateStatus);
            updateStatus();
        </script>
    </body>
</html>
